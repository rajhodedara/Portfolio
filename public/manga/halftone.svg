<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <pattern id="dots" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1.5" fill="#0A0A0A" opacity="0.3"/>
    </pattern>
  </defs>
  <!-- Background halftone -->
  <rect width="200" height="200" fill="url(#dots)"/>
  <!-- Ink dots at various sizes for visual depth -->
  <circle cx="10" cy="10" r="3" fill="#0A0A0A" opacity="0.2"/>
  <circle cx="30" cy="10" r="2" fill="#0A0A0A" opacity="0.15"/>
  <circle cx="50" cy="10" r="4" fill="#0A0A0A" opacity="0.25"/>
  <circle cx="70" cy="10" r="2" fill="#0A0A0A" opacity="0.2"/>
  <circle cx="90" cy="10" r="3" fill="#0A0A0A" opacity="0.15"/>
  <circle cx="110" cy="10" r="2" fill="#0A0A0A" opacity="0.2"/>
  <circle cx="130" cy="10" r="4" fill="#0A0A0A" opacity="0.25"/>
  <circle cx="150" cy="10" r="2" fill="#0A0A0A" opacity="0.15"/>
  <circle cx="170" cy="10" r="3" fill="#0A0A0A" opacity="0.2"/>
  <circle cx="190" cy="10" r="2" fill="#0A0A0A" opacity="0.15"/>

  <!-- Row 2 -->
  <circle cx="20" cy="20" r="4" fill="#0A0A0A" opacity="0.3"/>
  <circle cx="40" cy="20" r="2.5" fill="#0A0A0A" opacity="0.2"/>
  <circle cx="60" cy="20" r="3" fill="#0A0A0A" opacity="0.25"/>
  <circle cx="80" cy="20" r="5" fill="#0A0A0A" opacity="0.35"/>
  <circle cx="100" cy="20" r="2" fill="#0A0A0A" opacity="0.2"/>
  <circle cx="120" cy="20" r="3.5" fill="#0A0A0A" opacity="0.3"/>
  <circle cx="140" cy="20" r="2" fill="#0A0A0A" opacity="0.15"/>
  <circle cx="160" cy="20" r="4" fill="#0A0A0A" opacity="0.25"/>
  <circle cx="180" cy="20" r="3" fill="#0A0A0A" opacity="0.2"/>
</svg>
