<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120" width="300" height="120">
  <defs>
    <filter id="roughen">
      <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <!-- Explosion burst shape -->
  <polygon
    points="150,5 168,45 210,20 195,62 240,55 210,85 245,105 200,100 205,120 150,105 95,120 100,100 55,105 90,85 60,55 105,62 90,20 132,45"
    fill="#FFD60A"
    stroke="#0A0A0A"
    stroke-width="3"
    filter="url(#roughen)"
  />
  <!-- Text -->
  <text
    x="150" y="72"
    text-anchor="middle"
    font-family="'Bangers', Impact, cursive"
    font-size="36"
    font-weight="900"
    fill="#0A0A0A"
    letter-spacing="3"
    transform="rotate(-8, 150, 72)"
  >START!</text>
</svg>
