<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- Radiating speed lines from center -->
  <g stroke="#0A0A0A" stroke-width="1" opacity="0.4">
    <!-- 36 lines radiating outward, every 10 degrees -->
    <line x1="250" y1="250" x2="250" y2="0"/>
    <line x1="250" y1="250" x2="338" y2="12"/>
    <line x1="250" y1="250" x2="413" y2="87"/>
    <line x1="250" y1="250" x2="450" y2="185"/>
    <line x1="250" y1="250" x2="450" y2="250"/>
    <line x1="250" y1="250" x2="450" y2="315"/>
    <line x1="250" y1="250" x2="413" y2="413"/>
    <line x1="250" y1="250" x2="338" y2="488"/>
    <line x1="250" y1="250" x2="250" y2="500"/>
    <line x1="250" y1="250" x2="162" y2="488"/>
    <line x1="250" y1="250" x2="87" y2="413"/>
    <line x1="250" y1="250" x2="50" y2="315"/>
    <line x1="250" y1="250" x2="50" y2="250"/>
    <line x1="250" y1="250" x2="50" y2="185"/>
    <line x1="250" y1="250" x2="87" y2="87"/>
    <line x1="250" y1="250" x2="162" y2="12"/>
    <!-- Mid angles -->
    <line x1="250" y1="250" x2="293" y2="6"/>
    <line x1="250" y1="250" x2="380" y2="45"/>
    <line x1="250" y1="250" x2="445" y2="130"/>
    <line x1="250" y1="250" x2="494" y2="207"/>
    <line x1="250" y1="250" x2="494" y2="293"/>
    <line x1="250" y1="250" x2="445" y2="370"/>
    <line x1="250" y1="250" x2="380" y2="455"/>
    <line x1="250" y1="250" x2="293" y2="494"/>
    <line x1="250" y1="250" x2="207" y2="494"/>
    <line x1="250" y1="250" x2="120" y2="455"/>
    <line x1="250" y1="250" x2="55" y2="370"/>
    <line x1="250" y1="250" x2="6" y2="293"/>
    <line x1="250" y1="250" x2="6" y2="207"/>
    <line x1="250" y1="250" x2="55" y2="130"/>
    <line x1="250" y1="250" x2="120" y2="45"/>
    <line x1="250" y1="250" x2="207" y2="6"/>
  </g>
  <!-- Thicker accent lines -->
  <g stroke="#0A0A0A" stroke-width="2" opacity="0.6">
    <line x1="250" y1="250" x2="250" y2="0"/>
    <line x1="250" y1="250" x2="500" y2="250"/>
    <line x1="250" y1="250" x2="250" y2="500"/>
    <line x1="250" y1="250" x2="0" y2="250"/>
    <line x1="250" y1="250" x2="500" y2="0"/>
    <line x1="250" y1="250" x2="500" y2="500"/>
    <line x1="250" y1="250" x2="0" y2="500"/>
    <line x1="250" y1="250" x2="0" y2="0"/>
  </g>
</svg>
